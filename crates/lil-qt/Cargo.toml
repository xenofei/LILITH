[package]
# The package name has an underscore and the folder a dash: cxx-qt-cmake 0.10.0 fails to link a
# dashed package name (spike 10, S0.2; Ruling Q1 revised). Every `-p`, dependency and
# `cxx_qt_import_crate(... CRATES ...)` names `lil_qt`.
name = "lil_qt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The app's Rust side (P4a-R1). With default features it builds and tests without Qt; the `qt`
# feature adds the cxx-qt bridge (the `Lilith.Core` QML module), which CMake links into
# lil-image.exe as a static library.
[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
# No other feature may gate bridge code until cxx-qt PR #1496 ships: cxx-qt-build 0.10.0 reads a
# dashed feature name differently from rustc, which breaks the Windows link.
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
# Live previews arrive as base64 on `preview:<job_id>` (APP-031).
base64.workspace = true
cxx = { workspace = true, optional = true }
cxx-qt = { workspace = true, optional = true }
cxx-qt-lib = { workspace = true, optional = true }
lil-client = { path = "../lil-client" }
lil-parse = { path = "../lil-parse" }
lil-platform = { path = "../lil-platform" }
lil-protocol = { path = "../lil-protocol" }
lil-schema = { path = "../lil-schema" }
serde.workspace = true
serde_json.workspace = true
# rt-multi-thread: the background runtime that owns the session (APP-024); macros: `select!`
# in its event pump; net and io-util: the app's single-instance pipe (APP-013).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing.workspace = true

[build-dependencies]
cxx-qt-build = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
# The e2e tests (feature `qt`): a real test-channel core.
lil-testkit = { path = "../lil-testkit" }
tempfile.workspace = true
# desktop_app.rs (the desktop group): the foreground window, the windows of a process and the
# blocker's synthesized click in physical coordinates (Task 1's S1.4 recipe); instance.rs: a
# squatter's pipe with a security descriptor of its own, this process's threads, a
# Low-integrity launch (CreateProcessAsUserW), and a pipe handed from its creator to a holder.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
