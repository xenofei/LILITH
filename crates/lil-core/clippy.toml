# ARCH-112 / QA-024: lil-core writes files only through the store module.
# Every file-mutating std and tokio call is disallowed here; the allowances are function-level
# `#[allow(clippy::disallowed_methods)]` attributes in src/store/fsops.rs, one per function
# (enforced by crates/lil-testkit/tests/single_write_allowance.rs).

disallowed-methods = [
    { path = "std::fs::write", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "std::fs::rename", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "std::fs::remove_file", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::remove_dir", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::remove_dir_all", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::copy", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "std::fs::create_dir", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::create_dir_all", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::hard_link", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::set_permissions", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "std::fs::File::create", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "std::fs::File::create_new", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "std::fs::OpenOptions::open", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "tokio::fs::write", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "tokio::fs::rename", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "tokio::fs::remove_file", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::remove_dir", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::remove_dir_all", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::copy", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "tokio::fs::create_dir", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::create_dir_all", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::hard_link", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::set_permissions", reason = "ARCH-112: file mutation goes through lil_core::store" },
    { path = "tokio::fs::File::create", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    { path = "tokio::fs::OpenOptions::open", reason = "ARCH-112: file writes go through lil_core::store (Store::write, hash-checked, built on store/fsops.rs)" },
    # The platform file layer: every function that mutates files (or holds them against
    # writers) is reached only from src/store/fsops.rs.
    { path = "lil_platform::fs::replace_file", reason = "ARCH-112: file writes go through lil_core::store (fsops::replace)" },
    { path = "lil_platform::fs::move_new", reason = "ARCH-112: file moves go through lil_core::store (fsops::move_new)" },
    { path = "lil_platform::fs::copy_new", reason = "ARCH-112: file copies go through lil_core::store (fsops::copy_new)" },
    { path = "lil_platform::fs::set_readonly", reason = "ARCH-112: file mutation goes through lil_core::store (fsops::set_readonly)" },
    { path = "lil_platform::fs::try_lock_exclusive", reason = "ARCH-112: lock files go through lil_core::store (fsops::lock_exclusive)" },
    { path = "lil_platform::fs::try_lock_append", reason = "ARCH-112: log appends go through lil_core::store (fsops::append_locked)" },
    { path = "lil_platform::fs::open_shared", reason = "ARCH-112: file handles that block writers stay out of lil-core outside the store" },
    { path = "lil_platform::fs::flush", reason = "ARCH-112: file writes go through lil_core::store (fsops::write_temp)" },
    { path = "lil_platform::fs::open_exclusive", reason = "ARCH-112: exclusive handles and their deletes go through lil_core::store (fsops::remove_if)" },
    { path = "lil_platform::fs::create_junction", reason = "ARCH-112: the suite never creates links; test support only" },
    { path = "lil_platform::fs::ExclusiveFile::delete", reason = "ARCH-112: file deletes go through lil_core::store (fsops::remove_if)" },
    # Owner decision 5: lil-core never renames a state.db; only lil doctor sets one aside, after a yes.
    { path = "lil_platform::sqlite_files::set_aside", reason = "owner decision 5: only lil doctor sets a state.db aside, after the person's yes; the disposable telemetry.db goes through fsops::set_aside_db" },
    # Manifests keep key order (ARCH-076, CORE-148): under `preserve_order`, Map::remove is
    # swap_remove and moves the last key into the removed slot. Use `shift_remove`.
    { path = "serde_json::Map::remove", reason = "ARCH-076: use shift_remove (lil_schema::remove_key); Map::remove reorders keys" },
    { path = "serde_json::Map::remove_entry", reason = "ARCH-076: use shift_remove_entry; Map::remove_entry reorders keys" },
]
