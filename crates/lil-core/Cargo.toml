[package]
name = "lil-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The `lil-core` binary is src/main.rs: a Windows-subsystem executable, so starting it opens no
# console window (ARCH-005).

[dependencies]
# Previews ride the `preview:<job_id>` topic as base64 (ARCH-033).
base64.workspace = true
futures-util.workspace = true
# The ComfyUI client (loopback HTTP only, ARCH-068), through its async API.
reqwest.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The store and the index hash file bytes (ARCH-078: SHA-256 is the only content hash).
sha2.workspace = true
# `fs` only so clippy.toml can name the `tokio::fs` paths it forbids (ARCH-112).
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-util.workspace = true
# ComfyUI's websocket (loopback only, ARCH-068): its events and previews.
tokio-tungstenite.workspace = true
# App registrations (`apps\<app>.toml`, APP-061).
toml.workspace = true
# The diagnostics bundle's redacted `suite.toml`, comments kept (ARCH-121).
toml_edit.workspace = true
tracing.workspace = true
# The diagnostics bundle (P4a-R19).
zip.workspace = true
# The model-header readers of the inventory's families (CORE-164).
lil-parse = { path = "../lil-parse" }
lil-platform = { path = "../lil-platform" }
lil-protocol = { path = "../lil-protocol" }
lil-schema = { path = "../lil-schema" }

[dev-dependencies]
# The shrinkable simulated outside-writers reconciler (QA-046, tests/reconcile_sim.rs).
proptest.workspace = true
# The toast tests parse the toast XML (tests/notify.rs).
roxmltree.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
lil-testkit = { path = "../lil-testkit" }

[lints]
workspace = true
