[package]
name = "lil-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The stdio MCP server Claude Code starts (ARCH-012, ARCH-110). Global Constraints: lil-client,
# lil-protocol, rmcp, tokio, serde_json and tracing only.
[dependencies]
rmcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "sync"] }
tracing.workspace = true
lil-client = { path = "../lil-client" }
lil-protocol = { path = "../lil-protocol" }

[dev-dependencies]
lil-testkit = { path = "../lil-testkit" }

[lints]
workspace = true
