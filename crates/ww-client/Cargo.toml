[package]
name = "ww-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The client side of the core pipe (ARCH-110): find, start, verify and handshake with
# `ww-core`, then call tools and follow events. `blocking` wraps it for synchronous callers.
[dependencies]
futures-util.workspace = true
# Only for the `Serialize`/`DeserializeOwned` bounds of the generic request helpers.
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time"] }
tokio-util.workspace = true
ww-platform = { path = "../ww-platform" }
ww-protocol = { path = "../ww-protocol" }
ww-schema = { path = "../ww-schema" }

[dev-dependencies]
tempfile.workspace = true
ww-testkit = { path = "../ww-testkit" }

[lints]
workspace = true
