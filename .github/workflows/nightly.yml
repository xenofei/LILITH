# Nightly tier (QA-072), main only: a release build and test coverage (lcov, uploaded as an
# artifact). Later plans add the full crash suite here.
#
# Every nightly runs everything (ruling R25): the repo is public, so GitHub-hosted minutes are
# free. A newer nightly cancels one still running (QA-070's cancel-in-progress).

name: "CI: nightly"

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  nightly:
    name: nightly
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read # check out main
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: error
