# Nightly tier (QA-072), main only: a release build, test coverage (lcov, uploaded as an
# artifact) and the full crash suite (QA-055, the `crash_full_*` tests).
#
# The benchmarks (job `benchmarks`, owner decision 2026-11-01): `ctest --preset ci-bench` on the
# Qt build, report-only. A budget missed never fails the run: the job uploads the results and
# writes them to the job summary. Only a failed build fails it.
#
# Every nightly runs everything (ruling R25): the repo is public, so GitHub-hosted minutes are
# free. A newer nightly cancels one still running (QA-070's cancel-in-progress).

name: "CI: nightly"

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  nightly:
    name: nightly
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read # check out main
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Full crash suite
        run: cargo nextest run --workspace --run-ignored only -E 'test(/^crash_full_/)'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: error

  # The benchmarks (label bench, test-params.toml's [budgets]):
  # bench_hardware, bench_top_bar, bench_jobs_panel, bench_gui_stalls and bench_event_to_ui run
  # offscreen; bench_cold_start starts the deploy folder's lil-image 11 times on the runner's own
  # desktop session, as ci-deploy's deploy_runs_off_path does, with no hands-off pop-up on a
  # runner. Report-only: ctest's exit code is recorded, never returned. The Qt pair and the build
  # are set up as ci-pr-ready.yml's pr-ready-qt sets them up.
  benchmarks:
    name: benchmarks
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read # check out main
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install the Qt pair with naqt (Qt 6.12.0 + Qt WebEngine 6.140.0)
        shell: pwsh
        env:
          # As ci-pr-ready.yml: only a zip with this sha256 is run (QA-078).
          NAQT_ZIP_SHA256: 59825326d65895c7f0d57716768e014c5e1f8fb6e1e10244ea1a00acb886cc8f
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'naqt.zip'
          Invoke-WebRequest https://github.com/jdpurcell/naqt/releases/download/latest/naqt.zip -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:NAQT_ZIP_SHA256) { Write-Host "::error::naqt.zip sha256 is $sha, not the pinned $env:NAQT_ZIP_SHA256; not running it"; exit 1 }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'naqt')
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'naqt') -Recurse -Filter naqt.dll | Select-Object -First 1
          dotnet $dll.FullName install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir C:\Qt `
            --modules qtwebchannel qtpositioning qtshadertools qtimageformats `
            --extensions qtwebengine@6.140.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'LIL_QT_DIR=C:\Qt\6.12.0\msvc2022_64' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check the Qt pair (QA-077)
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/check-qt-pair.ps1

      - name: Release build
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev-shell.ps1 cargo build --workspace --release --locked

      - name: CMake configure (ci preset)
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { Write-Host "::error::Ninja is not on the runner image; nothing installs it"; exit 1 }
          pwsh -NoProfile -File tools/dev-shell.ps1 cmake --preset ci

      - name: CMake build and deploy folder (ci preset)
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev-shell.ps1 cmake --build --preset ci

      # Report-only: whatever the benches say, this step succeeds. Its output, the JUnit file and
      # the exit code go to the artifact, and the `bench:` lines and each test's result to the
      # job summary.
      - name: Benchmarks (ci-bench), report-only
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bench'
          New-Item -ItemType Directory -Force $out | Out-Null
          pwsh -NoProfile -File tools/dev-shell.ps1 ctest --preset ci-bench --verbose --output-junit (Join-Path $out 'bench-junit.xml') *>&1 |
            Tee-Object -FilePath (Join-Path $out 'bench.log')
          $code = $LASTEXITCODE
          Set-Content -Path (Join-Path $out 'exit-code.txt') -Value "$code"
          $log = Get-Content -LiteralPath (Join-Path $out 'bench.log')
          $summary = @('## Benchmarks (report-only)', '', "ctest exit code: $code (not used: a budget missed doesn't fail the nightly)", '',
                       '### Tests', '', '```')
          $summary += @($log | Where-Object { $_ -match 'Test\s+#\d+: \S+ .*(Passed|Failed|Not Run|Timeout|\*\*\*)' } | ForEach-Object { $_.Trim() })
          $summary += @('```', '', '### Figures', '', '```')
          $summary += @($log | Where-Object { $_ -match 'bench:|BENCH ' } | ForEach-Object { ($_ -replace '^.*?(bench:|BENCH )', '$1').Trim() })
          $summary += '```'
          $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmarks
          path: ${{ runner.temp }}/bench
          retention-days: 14
          if-no-files-found: warn
