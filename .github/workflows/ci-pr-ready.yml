# PR-ready tier (QA-071): everything the every-push tier runs, plus cargo-audit and a release
# build, on every non-draft PR. `lil dev merge` requires the `pr-ready` check on the PR's head
# commit (QA-033). The work runs in two parallel jobs, pr-ready-rust (the every-push tier and
# cargo-audit) and pr-ready-qt (the release build and the Qt build and tests); the job named
# pr-ready passes only when both succeeded. On a draft PR, both work jobs fail in their first
# step, on purpose, so pr-ready fails too: GitHub counts a skipped job as passing for required
# checks, so pr-ready is never skipped (R38). Marking the PR ready for review runs it again.
# `lil dev merge` refuses drafts too.
#
# The checkout is GitHub's merge of the PR into its base, so the tests run on what main would
# become. The work jobs run the PR's code with a read-only token; the guard's own judgement runs
# from main in ci-guard.yml.
#
# privacy-check-pr (QA-086, rulings R32-R35) runs `lil dev privacy-scan --range` (with the PR's
# branch name as `--ref-name`) on the PR's commits (refs/remotes/origin/<base>..<head>), drafts
# included, so the PR shows the privacy
# verdict for exactly what it would merge. The required check is `privacy-check` from
# ci-push.yml, which scans the same commits on every push; this job has its own name because a
# required check name must come from exactly one job. The denylist comes from the
# LIL_PRIVACY_DENYLIST Actions secret, passed in the variable of the same name; when it is missing
# or empty (fork PRs never get secrets), the job fails. Like privacy-check, it follows ci-guard's
# pattern (R21): the CLI is built from main without sccache in a step without the secret, the PR's
# commits are fetched as git data only, and the PR's code is never built or run. The step "Pick
# the CLI crate" finds main's CLI crate (crates/lil-cli), and fails if main has none.

name: "CI: PR ready"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # pr-ready's work runs in two jobs side by side, pr-ready-rust and pr-ready-qt; the job named
  # pr-ready only gathers their results (below). Each work job fails on a draft in its first step
  # (R38) and has its own concurrency group, so neither cancels the other.
  pr-ready-rust:
    name: pr-ready-rust
    runs-on: windows-2025
    timeout-minutes: 90
    concurrency:
      group: pr-ready-rust-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Drafts fail pr-ready
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" != "false" ]; then
            echo "::error::This PR is a draft, so pr-ready fails on purpose (a skipped check would count as passing). Mark the PR ready for review to run it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,cargo-audit@0.22.2

      # ---- the every-push tier ----
      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo-deny
        run: cargo deny check

      - name: Workspace tests
        run: cargo nextest run --workspace --locked

      - name: Spec tests
        run: cargo run --locked -p lil-cli -- dev spec-tests

      # ---- PR-ready additions ----
      - name: cargo-audit
        run: cargo audit

      # Plans 2-6 add their Rust-only PR-ready steps here (QA-071): the real-NTFS reconciler tests.

  pr-ready-qt:
    name: pr-ready-qt
    runs-on: windows-2025
    timeout-minutes: 90
    concurrency:
      group: pr-ready-qt-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Drafts fail pr-ready
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" != "false" ]; then
            echo "::error::This PR is a draft, so pr-ready fails on purpose (a skipped check would count as passing). Mark the PR ready for review to run it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # ---- Qt (plan 4a Task 15: ARCH-114, QA-068, QA-077, QA-078) ----
      # The Qt pair is installed by naqt every run, uncached: the repository's Actions cache is
      # full, and the install takes about a minute (Ruling Q-C). The release build and every CMake
      # and CTest command run through tools/dev-shell.ps1 (MSVC 14.44, checked; the Qt pair first
      # on PATH), which needs the Qt pair installed, so the install comes first.
      - name: Install the Qt pair with naqt (Qt 6.12.0 + Qt WebEngine 6.140.0)
        shell: pwsh
        env:
          # naqt's rolling `latest` release zip, built from commit 43da90f1 ("Support Qt 6.12"):
          # only a zip with this sha256 is run (QA-078).
          NAQT_ZIP_SHA256: 59825326d65895c7f0d57716768e014c5e1f8fb6e1e10244ea1a00acb886cc8f
        run: |
          $start = Get-Date
          $zip = Join-Path $env:RUNNER_TEMP 'naqt.zip'
          Invoke-WebRequest https://github.com/jdpurcell/naqt/releases/download/latest/naqt.zip -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:NAQT_ZIP_SHA256) { Write-Host "::error::naqt.zip sha256 is $sha, not the pinned $env:NAQT_ZIP_SHA256; not running it"; exit 1 }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'naqt')
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'naqt') -Recurse -Filter naqt.dll | Select-Object -First 1
          dotnet $dll.FullName install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir C:\Qt `
            --modules qtwebchannel qtpositioning qtshadertools qtimageformats `
            --extensions qtwebengine@6.140.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'LIL_QT_DIR=C:\Qt\6.12.0\msvc2022_64' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host ("Qt install: {0:N1} min" -f ((Get-Date) - $start).TotalMinutes)

      - name: Check the Qt pair (QA-077)
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/check-qt-pair.ps1

      # ---- PR-ready addition: the release build ----
      # In this job because the ci preset copies lil-core, lil and lil-mcp from target/release
      # instead of building them again (LIL_RUST_BIN_DIR), and through dev-shell.ps1 so they are
      # built with the same pinned 14.44 toolset as the rest of the deploy folder.
      - name: Release build
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev-shell.ps1 cargo build --workspace --release --locked

      - name: CMake configure (ci preset)
        shell: pwsh
        run: |
          # Both Windows Server 2025 images ship Ninja 1.13.2; nothing is installed in its place.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { Write-Host "::error::Ninja is not on the runner image; nothing installs it"; exit 1 }
          pwsh -NoProfile -File tools/dev-shell.ps1 cmake --preset ci

      - name: CMake build and deploy folder (ci preset)
        shell: pwsh
        run: |
          $start = Get-Date
          pwsh -NoProfile -File tools/dev-shell.ps1 cmake --build --preset ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Host ("CMake build: {0:N1} min" -f ((Get-Date) - $start).TotalMinutes)

      - name: Qt Quick Tests, offscreen (ci-qml)
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev-shell.ps1 ctest --preset ci-qml

      - name: Deploy folder checks (ci-deploy)
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev-shell.ps1 ctest --preset ci-deploy

      # Plans 2-6 add their Qt PR-ready steps here (QA-071): the serialised web view / clipboard /
      # drag / first-run group and E2E over the pipe.

  pr-ready:
    # The check run's name. `lil dev merge` requires it by exactly this name. It runs no PR code:
    # no checkout, no secrets, no token permissions. It passes only when every work job's result
    # is exactly `success`: a failed, cancelled or skipped job fails it. `if: always()` makes it
    # run even when a work job failed, since otherwise it would be skipped, and GitHub counts a
    # skipped required check as passing (R38).
    name: pr-ready
    needs: [pr-ready-rust, pr-ready-qt]
    if: always()
    runs-on: windows-2025
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Every pr-ready job succeeded
        env:
          RUST_RESULT: ${{ needs.pr-ready-rust.result }}
          QT_RESULT: ${{ needs.pr-ready-qt.result }}
        run: |
          echo "pr-ready-rust: $RUST_RESULT; pr-ready-qt: $QT_RESULT"
          if [ "$RUST_RESULT" != "success" ] || [ "$QT_RESULT" != "success" ]; then
            echo "::error::pr-ready passes only when pr-ready-rust and pr-ready-qt both succeed."
            exit 1
          fi

  privacy-check-pr:
    name: privacy-check-pr
    runs-on: windows-2025
    timeout-minutes: 30
    concurrency:
      group: privacy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main, not the pushed code: the CLI is built from main only (ruling R33, as in ci-guard).
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the commits to scan (as git data only)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "$HEAD_SHA"
          git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Pick the CLI crate
        id: pick
        # In main's working tree (the checkout above).
        run: |
          if [ -f crates/lil-cli/Cargo.toml ]; then
            pkg=lil-cli
            bin=lil
          else
            echo "::error::main has no crates/lil-cli, so there is no CLI to build."
            exit 1
          fi
          echo "Building $pkg (--bin $bin) from main."
          {
            echo "pkg=$pkg"
            echo "bin=$bin"
          } >> "$GITHUB_OUTPUT"

      - name: Rust toolchain from rust-toolchain.toml (main's)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Build the CLI from main (no secret in this step)
        env:
          pkg: ${{ steps.pick.outputs.pkg }}
          bin: ${{ steps.pick.outputs.bin }}
        run: |
          cargo build --locked -p "$pkg" --bin "$bin"

      - name: Privacy scan of the PR's commits, with the CLI built from main
        env:
          CLI_BIN: ./target/debug/${{ steps.pick.outputs.bin }}.exe
          # Repository secrets, not environment ones: every branch and every PR is scanned, so an
          # environment would have to admit them all. What protects them is that only the CLI
          # built from main (in the step before, without the secrets) runs here; the scanned
          # commits are read as git data and never built. A secret that doesn't exist arrives as
          # "", and the step then fails.
          LIL_PRIVACY_DENYLIST: ${{ secrets.LIL_PRIVACY_DENYLIST }} # zizmor: ignore[secrets-outside-env]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "${LIL_PRIVACY_DENYLIST:-}" ]; then
            echo "::error::The LIL_PRIVACY_DENYLIST secret is missing or empty, so the privacy scan can't run."
            exit 1
          fi
          "$CLI_BIN" dev privacy-scan --ref-name "refs/heads/$HEAD_REF" --range "refs/remotes/origin/$BASE_REF..$HEAD_SHA"
