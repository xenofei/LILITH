# Every-push tier (QA-070): formatting, lints, cargo-deny, the workspace tests and the spec tests
# on every push to a branch other than main. `lil dev merge` requires the `every-push` check on the
# PR's head commit (QA-033). Pushes to main are judged by post-merge.yml instead.
#
# Every push runs everything (ruling R25): the repo is public, so GitHub-hosted minutes are free,
# and a skipped run could report green on untested code.
#
# privacy-check (QA-086, rulings R32-R35) runs `lil dev privacy-scan --range` (with the pushed
# branch name as `--ref-name`) on every commit of the pushed branch that main doesn't have
# (refs/remotes/origin/main..<pushed sha>). It scans
# the whole branch, not only before..sha: a later clean push must not turn the check green on a
# branch whose earlier commits leaked something. `lil dev merge` and the main ruleset require
# `privacy-check` on the PR's head commit. The denylist comes from the LIL_PRIVACY_DENYLIST and
# WW_PRIVACY_DENYLIST Actions secrets, each passed in the variable of its own name (the CLI reads
# the new name first and skips a blank one); when both are missing or empty (fork PRs never get
# secrets), the job fails.
#
# The secret must never reach code from the pushed branch (a build.rs or a test could print it).
# So privacy-check follows ci-guard's pattern (R21): it checks out main, builds the CLI from main
# without sccache (the Actions cache is written by jobs that run unreviewed code), fetches the
# pushed commit as git data only, and never builds or runs it. The step "Pick the CLI crate"
# picks whichever CLI crate main has (crates/lil-cli, else crates/ww-cli), and fails if main has
# neither. The build is its own step, so main's build scripts never see the secret either; only
# the built CLI does. The workflow file itself comes from the pushed commit, which is why
# `.github/workflows/**` is protected (QA-019).
#
# aws-lc-sys (the rustls crypto provider) builds with the MSVC toolchain on windows-2025; CMake
# is preinstalled on that image if a future aws-lc-sys needs it. No NASM is needed for
# x86_64-pc-windows-msvc.

name: "CI: every push"

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  every-push:
    # The check run's name. `lil dev merge` requires it by exactly this name.
    name: every-push
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: push-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo-deny
        run: cargo deny check

      - name: Workspace tests
        run: cargo nextest run --workspace --locked

      - name: Spec tests
        run: cargo run --locked -p lil-cli -- dev spec-tests

      - name: Spec traceability report
        run: cargo run --locked -p lil-cli -- dev spec-report

  privacy-check:
    # The check run's name. `lil dev merge` and the main ruleset require it by exactly this name.
    name: privacy-check
    runs-on: windows-2025
    timeout-minutes: 30
    concurrency:
      group: privacy-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main, not the pushed code: the CLI is built from main only (ruling R33, as in ci-guard).
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the commits to scan (as git data only)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" "$HEAD_SHA"
          git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Pick the CLI crate
        id: pick
        # In main's working tree (the checkout above): lil-cli once main has it, else ww-cli.
        run: |
          if [ -f crates/lil-cli/Cargo.toml ]; then
            pkg=lil-cli
            bin=lil
          elif [ -f crates/ww-cli/Cargo.toml ]; then
            pkg=ww-cli
            bin=ww
          else
            echo "::error::main has neither crates/lil-cli nor crates/ww-cli, so there is no CLI to build."
            exit 1
          fi
          echo "Building $pkg (--bin $bin) from main."
          {
            echo "pkg=$pkg"
            echo "bin=$bin"
          } >> "$GITHUB_OUTPUT"

      - name: Rust toolchain from rust-toolchain.toml (main's)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Build the CLI from main (no secret in this step)
        env:
          pkg: ${{ steps.pick.outputs.pkg }}
          bin: ${{ steps.pick.outputs.bin }}
        run: |
          cargo build --locked -p "$pkg" --bin "$bin"

      - name: Privacy scan of the branch's commits that main lacks, with the CLI built from main
        env:
          CLI_BIN: ./target/debug/${{ steps.pick.outputs.bin }}.exe
          # Repository secrets, not environment ones: every branch and every PR is scanned, so an
          # environment would have to admit them all. What protects them is that only the CLI
          # built from main (in the step before, without the secrets) runs here; the scanned
          # commits are read as git data and never built. Each variable comes from the secret of
          # its own name: a secret that doesn't exist arrives as "", and the CLI skips a blank
          # variable, so the scan runs while either secret exists.
          LIL_PRIVACY_DENYLIST: ${{ secrets.LIL_PRIVACY_DENYLIST }} # zizmor: ignore[secrets-outside-env]
          WW_PRIVACY_DENYLIST: ${{ secrets.WW_PRIVACY_DENYLIST }} # zizmor: ignore[secrets-outside-env]
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "${LIL_PRIVACY_DENYLIST:-}" ] && [ -z "${WW_PRIVACY_DENYLIST:-}" ]; then
            echo "::error::Both the LIL_PRIVACY_DENYLIST and the WW_PRIVACY_DENYLIST secrets are missing or empty, so the privacy scan can't run."
            exit 1
          fi
          "$CLI_BIN" dev privacy-scan --ref-name "$GITHUB_REF" --range "refs/remotes/origin/main..$HEAD_SHA"
