[workspace]
resolver = "3"
members = ["crates/*"]
# M0 spike crates are standalone, not workspace members.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
sha2 = "0.11"
windows = "0.62"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
globset = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# lil dev reviewer-setup / approve (task 11): age scrypt encryption of the App key, RS256 JWTs
# through aws-lc-rs (already in the tree via rustls), hidden passphrase entry.
age = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
rpassword = "7"
zeroize = "1"
base64 = "0.23"
aws-lc-rs = "1"
# Task 12: the workflow-file tests parse YAML 1.2 (ruling R2: a maintained parser, not serde_yaml).
yaml-rust2 = "0.13"
# Plan 2a (core platform I), pinned to the crates.io releases current on 2026-10-15.
# tokio has no default features; each crate names its own:
#   lil-platform: net, rt, sync, time
#   lil-core:     rt-multi-thread, net, io-util, sync, time, macros, fs (+ test-util as a dev feature)
#   lil-client:   rt, net, io-util, sync, time
#   lil-testkit:  rt, net, io-util, time
tokio = { version = "1.53.3", default-features = false }
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
# Bundled SQLite (CORE-004): the bundled build compiles in FTS5 and JSON1.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Tool schemas, JSON Schema 2020-12 (ARCH-037). lil-protocol depends on it (ARCH-111).
schemars = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
tracing-appender = "0.2.5"
# Session, trace and idempotency ids: lil-platform only, never lil-protocol (ARCH-111).
getrandom = "0.4.3"
# Plan 2b (core platform I-b), pinned to the crates.io releases current on 2026-10-16.
# proptest without `fork`, `timeout` and `bit-set`: no rusty-fork or wait-timeout in the tree.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# suite.toml edits that keep comments and unknown keys (CORE-007).
toml_edit = "0.22.27"
# Plan 3 (core platform II), pinned to the crates.io releases current on 2026-10-18.
# GPU telemetry through the driver's nvml.dll, loaded at run time (CORE-059): lil-platform only.
nvml-wrapper = "0.13.0"
# CPU, RAM, per-process CPU time, network and disks (CORE-059): lil-platform only.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
# ComfyUI's websocket: the client in lil-core, the server in the test kit's fake.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
# The stdio MCP server (ARCH-012): lil-mcp only.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# The fake ComfyUI's HTTP server: lil-testkit only.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "http1"] }
# Plan 4a (Task 12): the diagnostics bundle (P4a-R19), current on crates.io on 2026-10-25; deflate
# only, through the pure-Rust zlib-rs back end.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The reviewer key's scrypt (N = 2^18) takes minutes unoptimised; optimise just the KDF so
# `lil dev reviewer-setup` / `approve` and their tests stay quick in dev and test builds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The index benchmarks (plan 2b Task 10) should not be dominated by unoptimised SQLite.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

