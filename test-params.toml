# Owner-facing test parameters (QA-019). PROTECTED: changes require owner approval.
# lil_testkit::params reads [proptest] and [budgets]; .config/nextest.toml still carries the
# timeout values directly and points back here as the record.

[timeouts]
unit_s = 30
integration_s = 120
# The lil-cli package's tests (real git repositories), an override in .config/nextest.toml.
lil_cli_s = 300
spec_s = 300
# The E2E tests (real lil and lil-core over a real pipe, QA-056): lil-spec-tests, lil-core and every
# package that uses lil-testkit. An override in .config/nextest.toml.
e2e_s = 300
# The setup script build-testbins in .config/nextest.toml builds lil and lil-core into
# target/testbins once per run (120 s x 5).
testbins_build_s = 600

[proptest]
cases = 256

[images]
# IMG-036: max per-channel difference tolerated in image comparisons.
max_channel_diff = 1

[budgets]
# CORE-042: the index budgets, in seconds, checked by crates/lil-core/tests/index_bench.rs.
# A cold rebuild of 2,000 assets (3 files each) must fit in 30 s.
index_rebuild_2000_assets_s = 30
# A warm reconcile of 10,000 assets (3 files each, nothing changed). The value is twice this
# reconcile's local measurement in plan 2b Task 10; the owner checks it against the CI
# Windows runner's figure (printed in the PR's CI log) and adjusts it, if needed, when
# approving the PR.
index_warm_reconcile_10000_assets_s = 6
# APP-138 and CORE-042 (P4b-R23, PF-25): `assets.query {limit: 200, facets: true}` at 10,000 and
# 50,000 assets, checked by the ignored facet benches in index_bench.rs. Each is twice the median of
# three p95 measurements (50.2 ms and 292.9 ms, plan 4b Task 5), rounded up to 10 ms; the owner
# accepted the 10,000-asset value over 100 ms (PF-28).
assets_query_facets_10000_ms = 110
assets_query_facets_50000_ms = 590
# CORE-038, CORE-042: `project.status` of a project of 10,000 assets (its orphans from the index's
# rows), checked by the ignored bench `project_status_10000` in index_bench.rs. Twice the median
# of three p95 measurements (176.8, 176.6 and 182.4 ms, plan 4b Task 21b), rounded up to 10 ms.
project_status_10000_assets_ms = 360
# Plan 4a's app budgets (APP-135, APP-136, APP-139), which apps/lil-ui-kit/CMakeLists.txt passes to
# the benches (CTest label bench) as LIL_BUDGET_<NAME>.
# bench_gui_stalls: the p99 of the GUI thread's 4 ms heartbeat lateness, in ms. Its frame interval's
# p99 is held to max(this, its idle p99 + half of this), since offscreen frames follow a timer, not a
# display (plan 4a ruling, 2026-11-01).
gui_stall_p99_ms = 16
# bench_event_to_ui: the p99 of job progress from Core's signal (after the session pump's 10 Hz
# limit) to the first frame that shows it, in ms (APP-139 as ruled 2026-11-01).
event_to_ui_ms = 100
# bench_cold_start: `interactive` of each warm start of the deploy folder, in ms.
cold_start_ms = 2000
# deploy_runs_off_path (tools/deploy/check-deploy.ps1): the deploy folder's size in MiB, the folder
# measured at plan 4a Task 29's head (371.9 MiB, every file of build/dev/deploy) plus 10 %, rounded up.
deploy_folder_mib = 409.1
