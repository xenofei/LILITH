# Owner-facing test parameters (QA-019). PROTECTED: changes require owner approval.
# lil_testkit::params reads [proptest] and [budgets]; .config/nextest.toml still carries the
# timeout values directly and points back here as the record.

[timeouts]
unit_s = 30
integration_s = 120
# The lil-cli package's tests (real git repositories), an override in .config/nextest.toml.
lil_cli_s = 300
spec_s = 300
# The E2E tests (real lil and lil-core over a real pipe, QA-056): lil-spec-tests, lil-core and every
# package that uses lil-testkit. An override in .config/nextest.toml.
e2e_s = 300
# The setup script build-testbins in .config/nextest.toml builds lil and lil-core into
# target/testbins once per run (120 s x 5).
testbins_build_s = 600

[proptest]
cases = 256

[images]
# IMG-036: max per-channel difference tolerated in image comparisons.
max_channel_diff = 1

[budgets]
# CORE-042: the index budgets, in seconds, checked by crates/lil-core/tests/index_bench.rs.
# A cold rebuild of 2,000 assets (3 files each) must fit in 30 s.
index_rebuild_2000_assets_s = 30
# A warm reconcile of 10,000 assets (3 files each, nothing changed). The value is twice this
# reconcile's local measurement in plan 2b Task 10; the owner checks it against the CI
# Windows runner's figure (printed in the PR's CI log) and adjusts it, if needed, when
# approving the PR.
index_warm_reconcile_10000_assets_s = 6
